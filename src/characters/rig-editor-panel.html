<template id="rig-tpl"><style>/* Layout: a sticky 3D stage beside a scrolling panel. The panel opens on a part picker, then that part's profile controls, then skeleton, motion, colors and export. */
:host{
  --bg:#f3f2f1; --panel:#fbfaf9; --stage:#e7e5e3; --fg:#1d1b1c; --muted:#6b6566; --line:#d8d4d2;
  --accent:#c8202a; --accent-fg:#ffffff; --chip:#ebe8e6; --ok:#1f7a4d;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :host{
    --bg:#161415; --panel:#1d1b1c; --stage:#262324; --fg:#ece8e6; --muted:#9a9395; --line:#3a3536;
    --accent:#ee4b54; --accent-fg:#1a0c0d; --chip:#2c2829; --ok:#52c28a; color-scheme:dark;
  }
}
[hidden]{display:none!important}
.rigwrap{min-height:100%}
:host{display:block}
:host([hidden]){display:none!important}
.rigwrap{height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{display:grid;grid-template-columns:minmax(0,1fr) 392px;height:100%}
#stageWrap{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--stage)}
#stage{position:relative;flex:1;min-height:320px}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
#tri{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-top:1px solid var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden}   /* a row of buttons wider than a narrow window wraps instead of running off its edge */
.seg button{flex:1 1 auto;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px;background:transparent;color:var(--fg);padding:6px 11px;font:inherit;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button{font-family:inherit;font-size:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.phase{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
.phase input{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
aside{min-width:0;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);
  padding:4px max(16px,env(safe-area-inset-right,0px)) 28px 16px}
aside h1{font-size:15px;font-weight:600;margin:14px 0 2px}
aside h2{font-size:15px;font-weight:600;margin:4px 0 2px}
aside h3{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
aside .sub{color:var(--muted);margin:0 0 8px;font-size:12.5px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:12.5px;line-height:1.2;min-width:0}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.editor{border:1px solid var(--line);border-radius:10px;padding:4px 14px 12px;margin:10px 0 6px;background:var(--bg)}
.pvs{display:flex;gap:10px;margin:8px 0 0}
.pvs figure{margin:0;flex:1;min-width:0}
.pvs figcaption{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.pvs svg{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--panel);border:1px solid var(--line);border-radius:6px}
details{border-top:1px solid var(--line);padding:2px 0}
summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-family:var(--mono)}
details[open]>summary::after{content:"\2212"}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:4px 0 12px}.mcols label{display:flex;gap:8px;align-items:center;font-size:13px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin:0 0 9px}
.row label{font-size:13px}
.row output{text-align:right;color:var(--muted);font-size:12px}
.numbox{display:flex;align-items:center;gap:4px;justify-self:end}
.numbox .num{width:78px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font:12px var(--mono);text-align:right}
.numbox .unit{color:var(--muted);font-size:11.5px;min-width:1.2em}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding-bottom:6px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px}
.colors input{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
textarea{width:100%;min-height:84px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:11.5px;resize:vertical}
.note{color:var(--muted);font-size:12.5px;margin:6px 0}
#status,#minStatus{min-height:18px;color:var(--ok);font-size:12.5px;margin:2px 0}
@media (max-width:820px){
  .rigwrap{height:auto}
  #app{display:block;height:auto}
  #stageWrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  #stage{flex:none;height:44vh;min-height:250px}
  aside{border-left:0;overflow:visible}
}
aside[data-page=mobs]>*:not(.pgAll):not(#mobBox){display:none!important}
aside:not([data-page=mobs]) #mobBox{display:none!important}
aside:not([data-page=comet]) #cometBox{display:none!important}
#app[data-page=mobs] #modes,#app[data-page=mobs] #modes2,#app[data-page=mobs] #views{display:none!important}
#app[data-page=comet] [data-m=barrier]{display:none!important}
#app:not([data-page=comet]) .cometOnly{display:none!important}
#pages{margin:4px 0 2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style>
<div class="rigwrap"><div id="app">
  <div id="stageWrap">
    <div id="stage"><div id="tri" class="mono"></div><div id="msg">The 3D viewer could not load. Check your connection and reopen this page.</div></div>
    <div class="bar">
      <div class="seg" id="views" role="group" aria-label="Camera view">
        <button data-v="front" aria-pressed="true">Front</button><button data-v="side" aria-pressed="false">Side</button><button data-v="back" aria-pressed="false">Back</button><button data-v="tq" aria-pressed="false">3/4</button>
      </div>
      <div class="seg" id="modes" role="group" aria-label="Pose">
        <button data-m="rest" aria-pressed="false">Rest</button><button data-m="idle" aria-pressed="false">Idle</button><button data-m="runS" aria-pressed="false">Slow Run</button><button data-m="run" aria-pressed="true">Mid Run</button><button data-m="runF" aria-pressed="false">Fast Run</button>
      </div>
      <div class="seg" id="modes2" role="group" aria-label="Moves">
        <button data-m="jump" aria-pressed="false">Jump</button><button data-m="slide" aria-pressed="false">Slide</button><button data-m="fall" aria-pressed="false">Faceplant</button><button data-m="set" aria-pressed="false">Runner's Pose</button><button data-m="drift" aria-pressed="false">Drift</button><button data-m="step" aria-pressed="false">Sidestep</button><button data-m="barrier" aria-pressed="false">Barrier</button><button data-m="cThrow" class="cometOnly" aria-pressed="false">Star Throw</button><button data-m="cHover" class="cometOnly" aria-pressed="false">Hover</button><button data-m="cFly" class="cometOnly" aria-pressed="false">Fly</button>
      </div>
      <button class="btn" id="play" aria-pressed="false">Pause</button>
      <label class="phase"><span class="mono" style="color:var(--muted)">cycle</span><input type="range" id="phase" min="0" max="1" step="0.005" value="0.25" aria-label="Animation cycle position"></label>
      <div class="seg"><button id="wire" aria-pressed="false">Wireframe</button></div>
    </div>
  </div>
  <aside>
    <div class="actions pgAll"><button class="btn" id="rigClose">&larr; Back to Title Screen</button></div>
    <div class="seg pgAll" id="pages" role="group" aria-label="Page"><button type="button" data-pg="molly" aria-pressed="true">Molly</button><button type="button" data-pg="comet" aria-pressed="false">Comet</button><button type="button" data-pg="mobs" aria-pressed="false">Mobs</button></div>
    <h1 class="pgAll" id="rigH1">Molly: Rig Editor</h1>
    <p class="sub">Pick a part below, or click it on the model. Orbit by dragging, zoom with scroll. Left and right sides match.</p>
    <details id="statBox"><summary>Stats</summary>
      <p class="sub">Molly's stat card. These numbers are the ones the game runs on: change a slider, close the editor, and she plays that way, with the card on the Characters page and pause menu following.</p>
      <div id="statRows"></div>
      <div class="actions"><button class="btn" id="resetStats">Reset Stats</button></div>
      <details id="moveBox"><summary>Movement Details</summary>
        <p class="sub">What the stats above do to her speed, acceleration, heading and turn radius. Every number here follows the sliders as you move them.</p>
        <div id="moveLive"></div>
        <h3>Try a Situation</h3>
        <p class="sub">Put her on a slope at a speed and a heading, and see what each part of the formula does to her.</p>
        <div id="moveScen"></div>
        <div id="moveOut"></div>
      </details>
    </details>
    <details id="cometBox" open><summary>Comet's Moves</summary>
      <p class="sub">Comet has no Strafe and no Barrier. Q or E: Star Throw (hold to charge). 2: Hover. Space held in the air while hovering: Fly. Her look, run and stats above are her own copy of Molly's stats.</p>
      <h3>Hover</h3><div id="cHov"></div>
      <h3>Fly</h3><div id="cFly"></div>
      <h3>Star Throw</h3><div id="cStar"></div>
      <h3>Star Colours</h3><div class="colors" id="cCols"></div>
      <div class="actions"><button class="btn" id="resetComet">Reset Comet's Moves</button></div>
    </details>
    <section class="editor" id="mobBox" aria-label="Mobs">
      <h2>Mobs</h2>
      <p class="sub">How each kind of mob looks, walks and fights. The preview shows the one picked here, walking at its top speed and chasing; Save to Game (or close the editor) and every one in the game follows.</p>
      <div class="seg" id="minTabs" role="group" aria-label="Which mob"></div>
      <p class="sub" id="minNote"></p>
      <h3>Look</h3><div id="minLook"></div><div id="minCols" class="mcols"></div>
      <h3>Walk</h3><div id="minWalk"></div>
      <h3>Stats</h3><div id="minStats"></div>
      <div class="actions"><button class="btn primary" id="saveMobs">Save to Game</button><button class="btn" id="resetMin">Reset This One</button></div>
      <div id="minStatus" role="status"></div>
    </section>
    <section class="editor" id="animSec" aria-label="Animation stats" hidden>
      <h2 id="animTitle"></h2>
      <p class="sub" id="animNote"></p>
      <div id="animRows"></div>
      <div class="chips" id="animStages" role="group" aria-label="Stage"></div>
      <div id="animKey"></div>
      <div class="actions"><button class="btn" id="resetAnim">Reset This Animation</button></div>
    </section>
    <div class="chips" id="chips" role="group" aria-label="Body part"></div>
    <section class="editor" aria-label="Selected part">
      <h2 id="partTitle"></h2>
      <p class="sub" id="partNote"></p>
      <div class="pvs">
        <figure><figcaption id="pvAcap">Front view</figcaption><svg id="pvA" viewBox="0 0 150 150" role="img" aria-label="Front outline of the selected part"></svg></figure>
        <figure><figcaption id="pvBcap">Side view</figcaption><svg id="pvB" viewBox="0 0 150 150" role="img" aria-label="Side outline of the selected part"></svg></figure>
      </div>
      <h3>Size</h3><div id="rSize"></div>
      <h3>Position of the Max Diameter</h3><div id="rCenter"></div>
      <h3 id="hStart">Start Taper and Curve</h3><div id="rStart"></div>
      <h3 id="hEnd">End Taper and Curve</h3><div id="rEnd"></div>
      <h3>Bulge 1</h3><div id="rB1"></div>
      <h3>Bulge 2</h3><div id="rB2"></div>
      <p class="note">Each part has two bulges, flat until you give them a depth. Position and direction place a bulge; the four widths set how far it reaches radially (degrees) and along the part (% of length); the four curvatures shape each side, from concave (pinched) to convex (boxy). Narrow bulges need more Sides per ring under Faceting.</p>
      <div id="xWrap"><h3>Extras for This Part</h3><div id="rExtra"></div></div>
      <p class="note">Taper is the size of that end as a percent of the max diameter. Curve of 1 is a straight cone, above 1 is fuller and rounder, below 1 is more pointed.</p>
      <div class="actions"><button class="btn" id="resetPart">Reset This Part</button></div>
    </section>
    <div id="groups"></div>
    <details open><summary>Colors</summary>
      <div class="colors" id="colors"></div>
    </details>
    <details open><summary>Save and Export</summary>
      <div class="actions">
        <button class="btn primary" id="exportGlb">Save to Game</button>
        <button class="btn" id="copyJson">Copy Settings</button>
        <button class="btn" id="resetAll">Reset All</button>
      </div>
      <div id="status" role="status"></div>
      <p class="note">Save to game rebuilds this runner (Molly or Comet) from these settings, rigs and animates her, and keeps her in this browser. Her new look and moves show up the next time you start a level.</p>
      <textarea id="json" spellcheck="false" aria-label="Settings JSON" placeholder="Paste settings JSON here, then press Apply"></textarea>
      <div class="actions"><button class="btn" id="applyJson">Apply Pasted Settings</button></div>
    </details>
  </aside>
</div>
</div></template>
