<script>
(function () {
  var canvas = document.getElementById('view');
  var stage = document.getElementById('stage');
  var startEl = document.getElementById('start');
  var speedo = document.getElementById('speedo');
  var segsEl = document.getElementById('segs'), segValEl = document.getElementById('segval'), seglineEl = document.getElementById('segline');
  var POWER_MAX = 100, BARRIER_COST = 12, BARRIER_DRAIN = 1;   // the Power Line: collected Segs, out of 100. Switching the Barrier on costs 12, keeping it up costs 1 per second
  function setSegLine(n) { seglineEl.style.width = Math.min(n, POWER_MAX) + '%'; }
  function setPower(v) { segCount = Math.max(0, Math.min(POWER_MAX, v)); setSegLine(segCount); }
  var SEGS_MAX = 999;   // the SEGS counter: every Seg she has picked up this run (a Big Seg counts 10), up to 999. It never goes down; spending the Power Line does not touch it
  function addSegs(n) { segTotal = Math.max(0, Math.min(SEGS_MAX, segTotal + n)); var f = Math.floor(segTotal + 1e-9); if (f !== +segValEl.textContent) segValEl.textContent = f; }   // a glowing red line along the bottom of the screen: 1% per Seg, full width at 100
  var timerEl = document.getElementById('timer'), timeValEl = document.getElementById('timeval'), toastEl = document.getElementById('toast');

  var SKY = 0x9fc7e8;
  var TILE = 2;            // one tile, in world units. 1 Zip = one tile per second.
  var RUN_SPEED = 160;     // top speed in world units per second (80 Zips)
  var ACCEL_TIME = 7;      // seconds to go from 0 to top speed, and back to 0
  var ACCEL = RUN_SPEED / ACCEL_TIME;
  var RP_TIME = 3, RP_SPEED = 50 * TILE;   // Runner's Pose: hold S standing still for 3 s, then launch at 50 Zips
  var BRAKE_MULT = 3;      // holding S slides her to a stop 3 times faster than coasting: top speed to standing in about 2.3 seconds
  var GRIP = 40;           // most sideways acceleration her feet can give (units/s^2): turn radius = speed^2 / GRIP. Set by the Sideways grip stat (kept in Zips/s^2: 20)
  var MAX_TURN = 7;        // fastest she can swing her direction (rad/s), which is what limits turns at low speed
  var SCRUB = 0.1;         // fraction of her speed lost per radian she turns
  var JUMP_H = 7.2;        // jump apex above her feet: twice her 3.6-unit height
  var GRAV = 40;           // downward acceleration (units/s^2), so the jump takes about 1.2 s. Set by the Gravity stat (kept in Zips/s^2: 20)
  var JUMP_V = Math.sqrt(2 * GRAV * JUMP_H);
  var WALL_GRIP = 1;       // how much of her grip survives on a wall: her grip times this times the cosine of the wall's angle, so a vertical wall gives none at all
  var WALL_FADE = 1;       // that cosine can be switched off (the 'Wall grip fades with the bank' stat): then a wall of any angle leaves her grip x Wall grip
  var SLOPE_FADE = 0;      // the same fade on ordinary ground (the 'Grip fades on slopes' stat): off, her grip is the same on any slope; on, it is her grip x the cosine of the slope under her
  var DRIFT_GRIP = 1;      // her grip while a Drift is held, as a multiple of her grip (the 'Grip while drifting' stat): 1 = the same as always
  var AIR_GRIP = 0.35;     // how much of her steering is left once her feet are off the ground
  var STEP_UP = 1;          // a ledge this small or smaller she just steps up, with no loss of speed
  var CLIMB_SLOPE = 1.05;   // ground steeper than this (rise per unit run, a little over 45 degrees) stops her like a wall
  var DROP_SLOPE = 0.35;   // ground that falls away faster than this leaves her in the air
  var BOUNCE_KEEP = 0.5, BOUNCE_MIN = 8, SLAM_ACC = 40 * TILE, SLAM_MAX = 60 * TILE, STRAFE_DIST = TILE;   // the Barrier: it bounces back up at half the speed it landed at, and S in the air drives it straight down (40 Zips/s^2, 60 Zips at most)
  var FALL_MAX = 100;      // free-fall speed limit: 50 Zips (units/s)
  var MIN_UP = 60;         // running uphill, the slope bleeds her speed down to 30 Zips and no further
  var FRIC = 160 / 7;       // friction (units/s^2): her slowdown whenever she is not driving herself (coasting, braking, or past her own top speed). Set by the Friction stat
  // Surface-plane movement: on a slope she moves, turns and takes the slope's pull as if the surface were a flat plane. plOn/plHu/plTh describe that plane (downhill heading, tilt)
  var plOn = false, plHu = 0, plTh = 0;
  var wallOn = false, wallCool = 0, wallR = 0, wallNx = 0, wallNz = 0;                   // on a true wall (a path banked past 80 degrees): her bank angle, and a short pause before she can catch a wall again after leaving one
  function wrapA(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }
  function toPl(a) { return Math.atan2(Math.sin(a) * Math.cos(plTh), Math.cos(a)); }      // a horizontal bearing (from downhill) -> the angle it makes along the surface
  function fromPl(p) { return Math.atan2(Math.sin(p), Math.cos(p) * Math.cos(plTh)); }    // and back
  var slA = 0, slDx = 0, slDz = 0, slDeg = 0;        // set by slopeAt: gravity's pull along the surface (units/s^2), the downhill direction, the angle
  function slopeAt(x, z) {
    groundGrad(x, z); var gx = ggx, gz = ggz, m = Math.sqrt(gx * gx + gz * gz);
    if (m < 1e-4) { slA = 0; slDeg = 0; return; }
    slDx = -gx / m; slDz = -gz / m; slDeg = Math.atan(m) * 57.29578;
    slA = GRAV * m / Math.sqrt(1 + m * m);                       // gravity (straight down) projected on the surface: GRAV x sin(angle) along the fall line
  }
  var LAUNCH_ANGLE = 0.4;  // how sharply the slope under her must steepen (radians, about 23 degrees) to throw her into the air
  var sgx = 0, sgz = 0;    // the ground's gradient as she has been running over it (smoothed over a few units), so turning does not look like a change in slope
  function gradAt(x, z) { groundGrad(x, z); }
  function tooSteep(x, z) {                                     // open ground too steep to stand on: steeper than she can walk up (CLIMB_SLOPE). Paths keep their banks and slopes, as do decks, platforms and lanes; she can always stand on those
    gradAt(x, z); if (ggx * ggx + ggz * ggz <= CLIMB_SLOPE * CLIMB_SLOPE || ggPath) return false;
    if (level === 3 && SB) { worldH0(x, z); if (wL2 === 1) return false; }
    return true;
  }
  function lowPoint(x, z) {                                     // the bottom of a cone or V too narrow for the ground grid to have a flat spot: steep wherever she stands, but nothing within 1.2 is lower, so there is nowhere to slide to and she can stand
    var g0 = groundH(x, z), r, a;
    for (r = 0.6; r < 1.3; r += 0.6) for (a = 0; a < 8; a++) if (groundH(x + Math.cos(a * Math.PI / 4) * r, z + Math.sin(a * Math.PI / 4) * r) < g0 - 0.05) return false;
    return true;
  }
  var slideBlend = 0;      // 0 standing/running pose, 1 full baseball slide
  var STRIDE_REF = 9;      // speed at which the run animation reaches full amplitude
  var CAM_DIST = 8.5;
  var SENS = 0.0025;

  // ---- Speedometer ----
  var MAX_ZIPS = 80;
  var CX = 100, CY = 100, R = 80;
  function pt(frac, r) {
    var a = Math.PI * (1 - frac);
    return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
  }
  function arcPath(frac) {
    var s = pt(0, R), e = pt(frac, R);
    return 'M' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) + ' A' + R + ' ' + R + ' 0 0 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
  }
  var trackEl = document.getElementById('track');
  var fillEl = document.getElementById('fill');
  var needleEl = document.getElementById('needle');
  var zipValEl = document.getElementById('zipval');
  trackEl.setAttribute('d', arcPath(1));
  (function buildTicks() {
    var g = document.getElementById('ticks');
    var NS = 'http://www.w3.org/2000/svg';
    for (var z = 0; z <= MAX_ZIPS; z += 5) {
      var major = z % 10 === 0;
      var f = z / MAX_ZIPS;
      var p1 = pt(f, major ? 66 : 70), p2 = pt(f, 75);
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('class', 'tick' + (major ? '' : ' minor'));
      l.setAttribute('x1', p1[0]); l.setAttribute('y1', p1[1]);
      l.setAttribute('x2', p2[0]); l.setAttribute('y2', p2[1]);
      g.appendChild(l);
      if (major) {
        var lp = pt(f, 55);
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'tick-label');
        t.setAttribute('x', lp[0]); t.setAttribute('y', lp[1]);
        t.textContent = String(z);
        g.appendChild(t);
      }
    }
  })();
  function setZips(zips) {
    var f = Math.max(0, Math.min(1, zips / MAX_ZIPS));
    needleEl.setAttribute('transform', 'rotate(' + (f * 180).toFixed(2) + ' ' + CX + ' ' + CY + ')');
    fillEl.setAttribute('d', f > 0.004 ? arcPath(f) : '');
    zipValEl.textContent = zips.toFixed(1);
  }
  setZips(0);
  // Dodecadash charge: a red bar just inside the ring, filling over the 6 seconds it takes to reach the full 120 Zips. It shows while the Barrier is up.
  var chTrackEl = document.getElementById('chtrack'), chFillEl = document.getElementById('chfill'), chLast = -1, chShown = false, DASH_BAR_R = 64;
  function arcPathR(frac, r) { var s0 = pt(0, r), e0 = pt(frac, r); return 'M' + s0[0].toFixed(2) + ' ' + s0[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 0 1 ' + e0[0].toFixed(2) + ' ' + e0[1].toFixed(2); }
  function setCharge(f, show) {
    if (show !== chShown) { chShown = show; chTrackEl.style.display = show ? '' : 'none'; chTrackEl.setAttribute('d', show ? arcPathR(1, DASH_BAR_R) : ''); chLast = -1; }
    f = show ? Math.max(0, Math.min(1, f)) : 0;
    if (Math.abs(f - chLast) < 0.002 && !(f === 0 && chLast !== 0)) return;
    chLast = f; chFillEl.setAttribute('d', f > 0.004 ? arcPathR(f, DASH_BAR_R) : '');
  }

  // ---- Renderer / scene ----
  var GFX = { aa: true, soft: true, fog: 1 };                   // graphics settings, kept in the browser
  try { var gs = JSON.parse(localStorage.getItem('pr_gfx') || '{}'); if (gs.aa === false) GFX.aa = false; if (gs.soft === false) GFX.soft = false; if (gs.fog >= 0.3 && gs.fog <= 1) GFX.fog = gs.fog; } catch (e) {}
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: GFX.aa });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = GFX.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 160 * GFX.fog, 640 * GFX.fog);

  var camera = new THREE.PerspectiveCamera(65, 1, 0.1, 700 * GFX.fog);
  // See-through: any opaque surface between the camera and Molly is drawn see-through (a fine stipple, most of it left out) inside a narrow cone along the line from the camera to her, so she is never hidden. It stops short of her, so she and the ground at her feet are drawn as usual.
  var SEE = { on: { value: 0 }, a: { value: new THREE.Vector3() }, b: { value: new THREE.Vector3() }, r: { value: 2.2 }, t1: { value: 0.8 } };
  THREE.Material.prototype.onBeforeCompile = function (shader) {
    if (this.transparent || this.isShaderMaterial || this.isPointsMaterial || this.isLineBasicMaterial || this.isSpriteMaterial || this.userData.noSee) return;
    if (shader.vertexShader.indexOf('#include <project_vertex>') < 0 || shader.fragmentShader.indexOf('void main() {') < 0) return;
    shader.uniforms.uSeeOn = SEE.on; shader.uniforms.uSeeA = SEE.a; shader.uniforms.uSeeB = SEE.b; shader.uniforms.uSeeR = SEE.r; shader.uniforms.uSeeT = SEE.t1;
    shader.vertexShader = 'varying vec3 vSeeW;\n' + shader.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n#ifdef USE_INSTANCING\n vSeeW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;\n#else\n vSeeW = (modelMatrix * vec4(transformed, 1.0)).xyz;\n#endif');
    shader.fragmentShader = 'varying vec3 vSeeW;\nuniform float uSeeOn; uniform vec3 uSeeA; uniform vec3 uSeeB; uniform float uSeeR; uniform float uSeeT;\n' + shader.fragmentShader.replace('void main() {', 'void main() {\n if (uSeeOn > 0.5) { vec3 sAB = uSeeB - uSeeA; float sT = dot(vSeeW - uSeeA, sAB) / max(1e-4, dot(sAB, sAB)); if (sT > 0.0 && sT < uSeeT) { float sD = length(vSeeW - (uSeeA + sAB * sT)), sR = uSeeR * (0.3 + 0.7 * sT / uSeeT); if (sD < sR) { float sB = fract(52.9829189 * fract(dot(floor(gl_FragCoord.xy), vec2(0.06711056, 0.00583715)))); if (sB > mix(0.28, 1.0, smoothstep(0.7, 1.0, sD / sR))) discard; } } }');
  };
  THREE.Material.prototype.customProgramCacheKey = function () { return 'see1'; };

  scene.add(new THREE.HemisphereLight(0xffffff, 0x7a7a52, 0.75));
  var sun = new THREE.DirectionalLight(0xfff3e0, 0.9);
  sun.position.set(12, 24, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.05;
  scene.add(sun);
  scene.add(sun.target);

  // ---- Valley: rolling grass between two cliff walls and a back wall, running 3,750 tiles toward -Z, then a narrow curve climbing out ----
  var VALLEY_TILES = 100;
  var LENGTH_TILES = 3750;              // the valley ends in a cliff this far from the start
  var LEDGE_FREE_TILES = 2000;          // no ledges until she has run this far
  var HALF = VALLEY_TILES * TILE / 2;   // 100 units from the centre line to each side wall, and from the start to the back wall
  var GRID = 2.5;                         // size of one terrain facet
  var EXTENT = 150;                       // terrain reaches 150 to each side and 150 behind (the cliffs are 50 thick)
  var WALL_HEIGHT = 46;
  var END = LENGTH_TILES * TILE;        // z = -END is the end wall
  var LEDGE_START = LEDGE_FREE_TILES * TILE;
  // Past the 7,500-unit mark the valley closes in and curves away. The walls pinch from 100 to 25 units either side of
  // centre at 45 degrees, then follow a 180-degree left-hand arc whose centre line has exactly the radius she can hold at top
  // speed (speed^2 / GRIP). The floor climbs along the arc until it is as high as the wall tops, and the channel opens
  // into a bare plateau.
  var FUN_LEN = 75, CH_HALF = 25;
  var TURN_R = RUN_SPEED * RUN_SPEED / GRIP;
  var FUN_Z1 = -END - FUN_LEN, ARC_CX = -TURN_R, ARC_CZ = FUN_Z1;
  var PL_X = ARC_CX - TURN_R, PL_HX = 25, PL_HZ = 30, PL_ZC = ARC_CZ + PL_HZ;   // a short stub where the channel meets the plateau, so the floor carries on level (no apron)
  // The plateau is the high ground the valley is cut into. It runs from the valley's west wall (so the wall tops are its surface)
  // out to 5,000 units beyond the channel mouth, and from 600 past the arc's far side to 300 behind the start. Its other three
  // edges are cliffs into nothing, with an invisible barrier just short of each.
  // The plateau is a five-cornered shape: its east edge is the valley's west rim (x -100, z -7575 to -6800), its north edge runs west
  // along z -7575 (the line through the arc's centre) to x -3500, its west edge is 125 long (z -7575 to -7450), and its south edge
  // runs straight west along z -6800 as far as the mouth of the curve (x -1280) before tapering in to (-3500, -7450). The arc's own
  // rock keeps a rim round it, then drops away.
  var PX0 = -3500, PX1 = -HALF, PZ0 = ARC_CZ, PZ1 = -5950, PXW = -4300, PZ1_OLD = -6800, PZ_W = -7450;     // bounding box; PZ1 is the south edge, PZ_W the low corner on the west edge
  var SL_DX = PX0 - PL_X, SL_DZ = PZ_W - PZ1_OLD, SL_LEN = Math.sqrt(SL_DX * SL_DX + SL_DZ * SL_DZ), SL_NX = SL_DZ / SL_LEN, SL_NZ = -SL_DX / SL_LEN;   // SL_N points out over the tapering cliff
  var RIM_R = TURN_R + CH_HALF + 40;
  var pdN = 0, pdW = 0, pdE = 0, pdS = 0, pdF = 0, pdH = 0;
  // How far (x, z) lies outside the plateau (negative: inside), counting the rock rim round the arc as part of it.
  function plateauOut(x, z) {
    pdN = ARC_CZ - z; pdW = PXW - x; pdE = x - PX1; pdF = z - PZ1; pdS = -1e9;   // the south edge now runs straight along the second valley's far rim (no taper)
    
    var dP = Math.max(pdN, pdW, pdE, pdF, pdS);
    pdH = z <= ARC_CZ ? Math.sqrt((x - ARC_CX) * (x - ARC_CX) + (z - ARC_CZ) * (z - ARC_CZ)) - RIM_R : 1e9;
    return Math.min(dP, pdH);
  }
  var PLATEAU_BARRIER = false;             // the plateau's edges (and their row of short rock spikes) are open now; its east side never had one
  var HILL_MIN = 20, HILL_MAX = 100;
  var PLANE_Y = WALL_HEIGHT - 100, PLANE_LEN = 1500, PLANE_Z0 = -8500, PLANE_Z1 = -6100;   // a flat plane 100 units below the plateau, west of its end
  var CHUNK = 100;                        // the world is built in square tiles this size, made ahead of her and dropped behind her
  var VIEW_AHEAD = 680 * GFX.fog, VIEW_BEHIND = 340;   // how far from her the world is kept built (fog hides anything farther)
  // Smooth random field in [0,1] that never repeats (value noise on a lattice, hashed so it works at any distance)
  function vnoise(x, z, k) {
    var ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
    fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
    var a = rand01(ix, iz, k), b = rand01(ix + 1, iz, k), c = rand01(ix, iz + 1, k), d = rand01(ix + 1, iz + 1, k);
    return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
  }
  function stepAt(n, t) {              // 0 below the threshold, 1 above it, with a very short slope between
    var u = (n - t) / 0.0006 + 0.5;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    return u * u * (3 - 2 * u);
  }
  // Ledges: wherever a slow random field crosses a threshold the ground steps up by 0.5 to 3 units. The contour lines of
  // the field make irregular shelves, mesas and drops that come and go at random, none taller than she can jump.
  // How tall a ledge is at this spot: anywhere from half a unit to three, changing slowly along its length.
  var GEN_LEDGES = false;
  function ledgeStep(x, z, k) {
    var v = (vnoise(x / 75 + k * 3.1, z / 75 - k * 1.7, 20 + k) - 0.15) / 0.7;
    v = v < 0 ? 0 : v > 1 ? 1 : v;
    var hh = 0.5 + 0.5 * Math.round(5 * v);
    var t = (-z - END * 0.4) / (END * 0.2); t = t < 0 ? 0 : t > 1 ? 1 : t;   // in the second half of the valley every shelf grows to the full 3 units (and there are fewer of them, see ledgeH), so only a few big ridges are left
    return 0.5 * Math.round((hh + (3 - hh) * t) * 2);                      // in half-unit levels, so a shelf's top stays flat instead of stepping a hair every cell
  }
  function ledgeH(x, z) {
    if (x > L3_MIN) return sbLedge(x, z);
    if (x > 20000) return ovLedge(x, z);                  // (level 2: only the Sink's maze has any)
    if (!GEN_LEDGES) return 0;                            // Grass Canyon's generated ledges are switched off: ledges are placed by hand now
    if (x > HALF || x < -HALF) return 0;                  // ledges belong to the first valley alone (cells are sampled at their centres, so the cut falls exactly on its walls): none in the cave, the second valley or on the plateau
    var n = 0.65 * vnoise(x / 270, z / 270, 11) + 0.35 * vnoise(x / 118.5 + 5.3, z / 118.5 - 2.1, 12);   // spread about 30% wider apart than before, so fewer ledges
    var q = (z + LEDGE_START) / -300; q = q < 0 ? 0 : q > 1 ? 1 : q;   // none before LEDGE_START, then they come in over 300 units
    var e = (z + END) / 500; e = e < 0 ? 0 : e > 1 ? 1 : e;             // and go out again over the last 500 units before the funnel
    var tl = (-z - END * 0.4) / (END * 0.2); tl = tl < 0 ? 0 : tl > 1 ? 1 : tl;
    var sh = (1 - q * q * (3 - 2 * q) * e * e * (3 - 2 * e)) * 0.75 + 0.18 * tl;    // the fade moves the contour thresholds, so shelves open and close at their full height instead of shrinking into small, choppy steps
    var h = ledgeStep(x, z, 0) * stepAt(n, 0.55 + sh) + ledgeStep(x, z, 1) * stepAt(n, 0.68 + sh) + ledgeStep(x, z, 2) * stepAt(n, 0.32 + sh);
    var r = Math.sqrt(x * x + z * z);                 // the starting meadow stays flat
    var f = (r - 28) / 30; f = f < 0 ? 0 : f > 1 ? 1 : f;
    var m = (x + 600) / 200; m = m < 0 ? 0 : m > 1 ? 1 : m;             // never out on the plateau
    return h * f * f * (3 - 2 * f) * m * m * (3 - 2 * m);
  }
  function terrainFlat(x, z) {
    return 0.95 * Math.sin(x * 0.045 + 0.7) * Math.cos(z * 0.037 - 0.4)
         + 0.60 * Math.sin((x + z) * 0.07 + 1.3)
         + 0.35 * Math.sin(x * 0.11 - z * 0.09 + 2.0);
  }
  function terrainH(x, z) { return terrainFlat(x, z) + ledgeH(x, z); }
  // Ledges are cut square: each 2.5-unit cell of the ground carries one ledge height (sampled at its centre), so a ledge
  // is a flat shelf with a vertical face where the next cell is a different height.
  function ledgeCell(ix, iz) { ledI = NaN; ledA = 0; var v = ledgeH((ix + 0.5) * GRID, (iz + 0.5) * GRID); ledCA = ledA; ledCI = ledI; return v; }
  // The height of the ground she actually stands on: the same flat triangles the mesh draws, so her feet never float or sink.
  var gcI = 1e9, gcJ = 1e9, gcA = 0, gcB = 0, gcC = 0, gcD = 0, ggx = 0, ggz = 0, gcBk = false, gcS = new Float64Array(36), BK_N = 5, ggxB = 0, ggzB = 0;   // a cell beside a steep bank is cut into BK_N x BK_N pieces, the ground and the picture alike
  var lnH = 0, lnGX = 0, lnGZ = 0;
  function narY(p, ps) { var lf = p.lf; return p.y0 + (lf && lf.flat ? l2RiseG(ps, lf.sl0, lf.sl1, lf.E) : p.dy ? p.dy * smooth01(ps / p.len) : 0); }   // the height of the narrow path's floor ps along piece p
  function narSl(p, ps) {                                    // and how steeply it climbs there
    var lf = p.lf; if (lf && lf.flat) return ps < lf.E ? lf.sl0 + (lf.sl1 - lf.sl0) * ps / lf.E : lf.sl1;
    if (p.dy) { var t = ps / p.len; t = t < 0 ? 0 : t > 1 ? 1 : t; return p.dy * 6 * t * (1 - t) / p.len; }
    return 0;
  }
  function narHW(x, z) {                                    // half the path's width: 4.6 between the rocks, opening out to 8 (16 wide) where it leaves the crags for the bay
    return L2_NHW + 3.4 * Math.max(smooth01((1330 - Math.hypot(x - L2_X, z + 741)) / 80), smooth01(ovKAt(x, z) / 0.15));
  }
  function laneAt(x, z) {                                   // (none in a bare Oceana) on the flat of the narrow path out of the cave? Then the ground is exactly the path's own height, not the mesh's (the mesh cannot keep a lane 6 wide perfectly smooth)
